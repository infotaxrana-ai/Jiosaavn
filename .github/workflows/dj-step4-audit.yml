name: Xiaozhi DJ Step 4 Compatibility Audit
on:
  workflow_dispatch:
    inputs:
      mode:
        description: DJ Mode to inspect
        required: true
        type: choice
        options:
          - artist_nonstop
          - hindi_90s_mix
          - hindi_classic_movie_1970_2010
          - bangla_classic_mix
          - ghazal_mix
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing DJ filtering
        run: python -m unittest -v test_step2.py test_step3.py
      - name: Build live DJ preview
        run: python build_dj_modes.py --mode '${{ inputs.mode }}' --live --output dj_mode_preview.json
      - name: Audit integration contract without changing device
        run: python audit_dj_integration.py
      - name: Publish review artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: dj-step4-${{ inputs.mode }}
          path: |
            dj_mode_preview.json
            dj_integration_audit.json
