name: Xiaozhi DJ Metadata Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current DJ tests
        run: python -m unittest -v test_step2.py test_step3.py
      - name: Inspect live API candidates across all six DJ modes and each provider
        run: python diagnose_live_candidates.py
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-dj-live-api-diagnostic
          path: dj_live_api_diagnostic.json
          if-no-files-found: warn
