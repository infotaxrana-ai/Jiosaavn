name: Xiaozhi DJ Step 4 Final Review
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download previous Recovery Preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, urllib.request, zipfile, io, pathlib, sys
          owner_repo=os.environ['GITHUB_REPOSITORY']
          artifact_id='12924264142'
          url=f'https://api.github.com/repos/{owner_repo}/actions/artifacts/{artifact_id}/zip'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'Xiaozhi-DJ-Step4-Review'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(5_000_000)
          except Exception as e:
            raise SystemExit(f'Artifact download failed: {type(e).__name__}. Confirm old artifact has not expired and Actions read permission is available.')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            target=next((name for name in z.namelist() if name.endswith('dj_step4_recovery_preview.json')),None)
            if not target:raise SystemExit('Recovery JSON is missing in artifact')
            payload=z.read(target)
            if len(payload)>5_000_000:raise SystemExit('Recovery JSON too large')
          pathlib.Path('dj_step4_recovery_preview.json').write_bytes(payload)
          print('Recovery JSON downloaded from prior GitHub Actions run')
          PY
      - name: Run Step 4 Final review (read only)
        run: python -u dj_step4_final.py --input dj_step4_recovery_preview.json --output dj_step4_final_preview.json
      - name: Upload final review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-step4-final-review
          path: dj_step4_final_preview.json
          if-no-files-found: warn
