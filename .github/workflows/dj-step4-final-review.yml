
name: Xiaozhi DJ Step 4 Final Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests
        run: python -m unittest -v test_step2.py test_step3.py

      - name: Generate fresh Recovery JSON
        run: |
          python -u dj_step4_recovery.py \
            --limit 40 \
            --output dj_step4_recovery_preview.json

      - name: Run Final DJ Filter
        run: |
          python -u dj_step4_final.py \
            --input dj_step4_recovery_preview.json \
            --output dj_step4_final_preview.json

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("dj_step4_final_preview.json")
          if not p.exists():
              raise SystemExit("Final preview missing")

          data = json.loads(p.read_text(encoding="utf-8"))
          summary = data.get("summary", {})
          print("STEP4_FINAL_SUMMARY:", summary)

          if not data.get("preview_only"):
              raise SystemExit("Unsafe output: not preview-only")
          PY

      - name: Upload DJ Final Review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-step4-final-review
          path: |
            dj_step4_recovery_preview.json
            dj_step4_final_preview.json
          if-no-files-found: warn
